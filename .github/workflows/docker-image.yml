name: Maven Build and Docker Image CI

# 打 tag 推送时触发，例如: git tag tag-v1.0.0 && git push origin tag-v1.0.0
# 也支持在 Actions 页面手动输入版本号；镜像同时发布版本号和 latest
on:
  push:
    tags:
      - 'tag-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号，可填 1.0.0、v1.0.0 或 tag-v1.0.0；留空则使用 latest 和短 SHA'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 只构建 app 模块（plugin 模块依赖本地 SNAPSHOT 构件 deepseek-harness-java-types，CI 无法解析，且镜像只需要 app 的 jar）
      - name: Build with Maven
        run: |
          mvn clean package -pl mall-app -am -Dmaven.test.skip=true

      - name: Set Image Tags
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/tag-v* ]]; then
            VERSION="${GITHUB_REF_NAME#tag-v}"
          elif [[ -n "$VERSION_INPUT" ]]; then
            VERSION="${VERSION_INPUT#tag-v}"
            VERSION="${VERSION#v}"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/tag-v* && -z "$VERSION" ]]; then
            echo "tag-v 后必须包含版本号，例如 tag-v1.0.0"
            exit 1
          fi
          if [[ -n "$VERSION_INPUT" && -z "$VERSION" ]]; then
            echo "手动输入的版本号不能为空，例如 1.0.0"
            exit 1
          fi

          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "版本号不符合 Docker tag 格式：$VERSION"
            exit 1
          fi

          if [[ -n "$VERSION" ]]; then
            TAGS=(
              "fuzhengwei/2d-weekend-mall:${VERSION}"
              "fuzhengwei/2d-weekend-mall:latest"
              "registry.cn-hangzhou.aliyuncs.com/fuzhengwei/2d-weekend-mall:${VERSION}"
              "registry.cn-hangzhou.aliyuncs.com/fuzhengwei/2d-weekend-mall:latest"
            )
          else
            TAGS=(
              "fuzhengwei/2d-weekend-mall:latest"
              "fuzhengwei/2d-weekend-mall:sha-${GITHUB_SHA::7}"
              "registry.cn-hangzhou.aliyuncs.com/fuzhengwei/2d-weekend-mall:latest"
              "registry.cn-hangzhou.aliyuncs.com/fuzhengwei/2d-weekend-mall:sha-${GITHUB_SHA::7}"
            )
          fi

          {
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mall-app/ActionDockerfile
          # 所需要的体系结构，可以在 Available platforms 步骤中获取所有的可用架构 https://docs.docker.com/build/building/multi-platform/
          platforms: linux/amd64
          # 打 tag 或手动输入版本号时直接推送镜像
          push: true
          # 关闭 provenance 证明（OCI 清单），阿里云 ACR 不支持该格式
          provenance: false
          # 同时推送到 DockerHub 和阿里云镜像库
          tags: ${{ steps.meta.outputs.tags }}
